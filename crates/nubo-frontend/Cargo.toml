[package]
name = "nubo-frontend"
description = "Everything a Nubo app needs that isn't drawing: palettes, the model rule, clocks, pictures, settings, controls, battery saves, save states, cheats, the game library, running a game and game controllers."
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Files in the user's folders: settings, battery saves, save states, cheats,
# screenshots and the game library (see src/storage/files.rs), with the
# library's folder watcher and box art downloads; the desktop's sound for
# running a game (src/session/audio.rs); the checksums scenes name their
# game by (src/scenes.rs); and the desktop's font, read from the desktop
# portal on Linux (src/desktop_font.rs).
desktop = [
    "dep:cpal",
    "dep:crc32fast",
    "dep:directories",
    "dep:image",
    "dep:notify-debouncer-full",
    "dep:opener",
    "dep:sha2",
    "dep:ureq",
    "dep:zbus",
]
# Game controllers, read with gilrs (src/gamepads.rs). On the desktop a
# thread reads them and waits on the app's channel (futures' executor).
gamepads = ["dep:gilrs", "futures/executor"]
# The browser's localStorage for settings, battery saves and cheats (see
# src/storage/local_storage.rs) and its IndexedDB for save states, the game
# library and the games' files (src/storage/indexed_db.rs), with PNG pictures;
# screenshots as downloads and box art fetched by the browser; and the
# browser's sound for running a game (cpal's WebAudio backend) and the clock
# that paces it (src/session/).
web = [
    "dep:base64",
    "dep:crc32fast",
    "dep:cpal",
    "cpal/wasm-bindgen",
    "dep:image",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
nubo-core.workspace = true
# The oneshot channel that hands background work's result back.
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
web-time = "1.1"
# The player's local hour, which picks the night or day look of Nubo's Super
# Game Boy border (src/sgb_menu.rs); in the browser it asks JavaScript's Date.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# The checksum box art is looked up by (src/library/box_art/).
crc32fast = { version = "1.5", optional = true }
directories = { version = "6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The library's folder watcher (src/library/watcher.rs).
notify-debouncer-full = { version = "0.7", optional = true }
# Opening web pages and folders in the system's own apps (src/links.rs).
opener = { version = "0.9", default-features = false, optional = true }
# The checksums scenes name their game's ROM by (src/scenes.rs).
sha2 = { version = "0.11", optional = true }
# Box art downloads (src/library/box_art/download.rs).
ureq = { workspace = true, optional = true }
# The sound of a running game (src/session/audio.rs).
cpal = { version = "0.18", optional = true }
# Game controllers (src/gamepads.rs).
gilrs = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "DomException",
    "DomStringList",
    "Element",
    "Event",
    "HtmlAnchorElement",
    "HtmlElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "Url",
    "Window",
], optional = true }

# The desktop portal, which names the desktop's font (src/desktop_font.rs).
# Iced already uses zbus to read the light or dark style, with the same
# features.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
# The pictures of the browser's save states and library, tested in every build.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
