[package]
name = "nubo-frontend"
description = "Everything a Nubo app needs that isn't drawing: palettes, the model rule, clocks, pictures, settings, controls, battery saves, save states, cheats, the game library, running a game and game controllers."
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Files in the user's folders: settings, battery saves, save states, cheats,
# screenshots and the game library (see src/storage/files.rs), with the
# library's folder watcher and box art downloads; and the desktop's sound
# for running a game (src/session/audio.rs).
desktop = [
    "dep:cpal",
    "dep:crc32fast",
    "dep:directories",
    "dep:image",
    "dep:notify-debouncer-mini",
    "dep:ureq",
]
# Game controllers, read with gilrs (src/gamepads.rs). On the desktop a
# thread reads them and waits on the app's channel (futures' executor).
gamepads = ["dep:gilrs", "futures/executor"]
# The browser's localStorage: settings and battery saves (see
# src/storage/local_storage.rs); and the browser's sound for running a game
# (cpal's WebAudio backend) and the clock that paces it (src/session/).
web = ["dep:base64", "dep:cpal", "cpal/wasm-bindgen", "dep:web-sys"]

[dependencies]
nubo-core.workspace = true
# The oneshot channel that hands background work's result back.
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
web-time = "1.1"
# The checksum box art is looked up by (src/library/box_art/download.rs).
crc32fast = { version = "1.5", optional = true }
directories = { version = "6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# The library's folder watcher (src/library/watcher.rs).
notify-debouncer-mini = { version = "0.7", optional = true }
# Box art downloads (src/library/box_art/download.rs).
ureq = { workspace = true, optional = true }
# The sound of a running game (src/session/audio.rs).
cpal = { version = "0.18", optional = true }
# Game controllers (src/gamepads.rs).
gilrs = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
web-sys = { version = "0.3", features = ["Window", "Storage"], optional = true }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }

[lints]
workspace = true
