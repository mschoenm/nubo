# Screenshot candidates waiting for the maintainer's pick (the `screenshots`
# skill, "Collect new screenshots"). Not published: to render them, append
# these entries to images/screenshots.toml and run
# `cargo xtask screenshots gallery`. Once picked, the chosen ones move into
# images/screenshots.toml with real file names, and this file and the
# scenes nobody picked are deleted.

