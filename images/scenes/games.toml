# The games scenes may use (see docs/SCREENSHOTS_PLAN.md and
# xtask/src/screenshots/lists.rs): free homebrew games whose licenses let
# anyone share pictures of them, downloaded at a fixed commit of the gbdev
# Homebrew Hub database by `cargo xtask screenshots`. `file` is the name
# the game is saved under, which the app shows as the game's name, and the
# name scenes know the game by. Every game in a published screenshot must be
# credited in the README with its title (a test and the task check it).

