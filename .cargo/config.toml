[alias]
xtask = "run --package xtask --"
play = "run --release --package nubo --"
screenshot = "run --release --package nubo-headless -- --screenshot target/screenshots"
test-roms = "run --release --package nubo-test-rom-runner --"
cpu-tests = "run --release --package nubo-json-test-runner --"
benchmark = "run --release --package nubo-benchmark --"
save-states = "run --release --package nubo-save-state-check --"
