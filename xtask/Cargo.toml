[package]
name = "xtask"
license.workspace = true
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
nubo-core.workspace = true
nubo-download.workspace = true
# The scenes the screenshots are made from (src/screenshots.rs) and their
# pictures (src/scene.rs), without the app's storage, sound or controllers.
nubo-frontend.workspace = true
nubo-logo.workspace = true
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
wasm-bindgen-cli-support.workspace = true

[lints]
workspace = true
