[workspace]
resolver = "2"
members = [
    "crates/retroboy-core",
    "crates/retroboy-wasm",
    "crates/serializable_derive",
    "frontends/headless",
    "frontends/iced",
    "frontends/json_test_runner",
    "frontends/sdl",
]
default-members = [
    "crates/retroboy-core",
    "crates/retroboy-wasm",
    "crates/serializable_derive",
]

[workspace.package]
license = "Apache-2.0"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
retroboy-core = { path = "crates/retroboy-core" }
serializable_derive = { path = "crates/serializable_derive" }
