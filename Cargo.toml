[workspace]
resolver = "2"
members = [
    "crates/nubo-core",
    "crates/nubo-download",
    "crates/nubo-frontend",
    "crates/nubo-logo",
    "crates/nubo-serializable-derive",
    "frontends/nubo",
    "frontends/nubo-libretro",
    "tools/nubo-benchmark",
    "tools/nubo-headless",
    "tools/nubo-json-test-runner",
    "tools/nubo-save-state-check",
    "tools/nubo-test-rom-runner",
    "xtask",
]
default-members = [
    "crates/nubo-core",
    "crates/nubo-serializable-derive",
]

[workspace.package]
license = "GPL-3.0-or-later"
repository = "https://github.com/mschoenm/nubo"
version = "0.11.0"
edition = "2024"
# The Rust of the freedesktop SDK, which builds the Flatpak here and on
# Flathub alike and can lag behind the newest stable Rust that CI uses. The
# crates the app is built from inherit it, so clippy rejects newer standard
# library items in pull requests. The Flatpak build fails when the SDK's
# Rust is another version, so this follows it.
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
bool_to_int_with_if = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
wildcard_imports = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
nubo-core = { path = "crates/nubo-core" }
nubo-download = { path = "crates/nubo-download" }
nubo-frontend = { path = "crates/nubo-frontend" }
nubo-logo = { path = "crates/nubo-logo" }
nubo-serializable-derive = { path = "crates/nubo-serializable-derive" }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-cli-support = "=0.2.129"

[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1

# The core's unit tests boot every hardware model dozens of times (see
# emulator/tests.rs), which takes minutes without optimizations. Overflow
# checks and debug assertions stay on.
[profile.test.package.nubo-core]
opt-level = 2
