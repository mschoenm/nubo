# The newest stable Rust, for CI and local builds alike: like every tool and
# dependency here, Rust follows its newest stable release, and the nightly CI
# run is where anything a new release breaks shows up first. The Flatpak
# builds with the freedesktop SDK's Rust instead, as Flathub does (see
# `rust-version` in Cargo.toml).
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
