[package]
name = "nubo"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nubo-core.workspace = true
nubo-logo.workspace = true
iced = { version = "0.14", features = ["image", "canvas"] }
# Iced's image handles hold their pixels as `Bytes`; ui/pictures.rs shares a
# picture's pixels with its handle without copying them.
bytes = "1.12"
rfd = "0.17"
lucide-icons = "1.55"
serde = { version = "1", features = ["derive"] }
toml = "1"

# The shared crate keeps data in files and plays the sound through the
# desktop's sound card on the desktop, and uses localStorage and the
# browser's sound in the browser. Both builds read game controllers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nubo-frontend = { workspace = true, features = ["desktop", "gamepads"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nubo-frontend = { workspace = true, features = ["web", "gamepads"] }
iced = { version = "0.14", features = ["image", "canvas", "webgl"] }
console_error_panic_hook = "0.1"
# Not used directly: pins wasm-bindgen to the version of the bindings
# generator in xtask, which must match it exactly.
wasm-bindgen.workspace = true

# For the Windows executable's icon and file properties (build.rs).
[build-dependencies]
nubo-logo.workspace = true
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
