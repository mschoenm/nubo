[package]
name = "nubo"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nubo-core.workspace = true
nubo-logo.workspace = true
# "advanced" is for ui/tallest.rs, a widget of the app's own. Images without
# codecs: every picture the app shows is pixels nubo-frontend already decoded
# (ui/pictures.rs), and the codecs (AVIF, EXR, TIFF, ...) would add megabytes.
iced = { version = "0.14", features = ["advanced", "image-without-codecs"] }
# Iced's image handles hold their pixels as `Bytes`; ui/pictures.rs shares a
# picture's pixels with its handle without copying them.
bytes = "1.12"
# "file-handle-inner" lets the browser's picker check a file's size before
# reading it into the page's memory (rom_picker.rs).
rfd = { version = "0.17", features = ["file-handle-inner"] }
lucide-icons = "1.55"
serde = { version = "1", features = ["derive"] }
toml = "1"

# The shared crate keeps data in files and plays the sound through the
# desktop's sound card on the desktop, and uses localStorage and the
# browser's sound in the browser. Both builds read game controllers.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nubo-frontend = { workspace = true, features = ["desktop", "gamepads"] }
# The command line; the browser build has none.
clap.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
nubo-frontend = { workspace = true, features = ["web", "gamepads"] }
iced = { version = "0.14", features = ["advanced", "image-without-codecs", "webgl", "fira-sans"] }
console_error_panic_hook = "0.1"
# Not used directly: pins wasm-bindgen to the version of the bindings
# generator in xtask, which must match it exactly.
wasm-bindgen.workspace = true

# SIGTERM and the other stop signals close the app like its window's close
# button (subscriptions.rs); Windows has no such signals.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.5"

# For the Windows executable's icon and file properties (build.rs).
[build-dependencies]
nubo-logo.workspace = true
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
