[package]
name = "nubo-libretro"
description = "Nubo as a libretro core, for RetroArch and other libretro frontends."
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# RetroArch loads the `cdylib`; the `rlib` lets tests call the core.
[lib]
name = "nubo_libretro"
crate-type = ["cdylib", "rlib"]

[dependencies]
nubo-core.workspace = true
# Only the palettes and the model rule: without features (it has no default
# ones), no storage, sound or controllers.
nubo-frontend.workspace = true

[dev-dependencies]
# Reads the built library's exported symbols (tests/exports.rs).
object = { version = "0.40", default-features = false, features = ["read", "std"] }

# The workspace's lints (root Cargo.toml), except that `unsafe_code` is
# denied instead of forbidden: a libretro core exports C functions and reads
# RetroArch's pointers, which only `src/ffi.rs` does, under an `expect`. Keep
# the clippy list the same as the workspace's.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
bool_to_int_with_if = "warn"
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
manual_assert = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
wildcard_imports = "warn"
