name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # The nightly workflow, which releases run, runs these checks too.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the checks still running for the old
# one. A run on main is never cancelled once it has started, but one still
# waiting gives way to a newer push, whose deploy then includes its commit.
#
# Every job here should finish in about a minute, so pull requests get their
# answer fast. Slower checks belong in nightly.yml, which every release runs
# too, so nothing they would catch is ever released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in the dev and test profiles: nobody runs a debugger in
  # CI, a panic's message still gives its file and line, and debug info was
  # most of the size of the Rust caches. rust-cache puts these variables in
  # its keys, so every workflow sets the same values (docs/CI.md, "Caches").
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

# `rustup toolchain install` installs the newest stable Rust, which
# rust-toolchain.toml asks for, and taiki-e/install-action the newest
# cargo-deny. Third-party actions are pinned to a commit, so a hijacked tag
# can't run code with this repository's tokens; Dependabot moves the pins to
# each new release.
jobs:
  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install audio and controller libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy for the browser build
        run: cargo clippy -p nubo --target wasm32-unknown-unknown --locked -- -D warnings

      # Catches broken links in doc comments, which clippy doesn't check.
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  dependencies:
    name: Dependency licenses and sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      # Advisories are checked nightly instead, so a new advisory doesn't fail
      # pull requests that have nothing to do with it.
      - name: Check licenses, banned crates and sources
        run: cargo deny --locked check licenses bans sources

  # Linux only, so pull requests get their answer in a minute or two.
  # The nightly workflow, which releases run, tests on macOS and Windows with
  # platforms.yml.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install audio and controller libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install

      # Shared with the nightly tests, which run on macOS and Windows too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --workspace --locked

  test-roms:
    name: Test ROMs, CPU tests and save states
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      # Shared with the nightly jobs, which build the same crates in release.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/test-roms

      # Without --verify-boot, which the nightly workflow runs.
      - name: Run test ROMs
        run: cargo test-roms

      - name: Run JSON CPU tests
        run: cargo cpu-tests

      # The games of the kept save states (save-states/), pinned and
      # checksummed, so the cache only changes when the pins do.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: benchmark-roms
        with:
          path: target/benchmark-roms
          key: benchmark-roms-${{ hashFiles('xtask/src/benchmark_roms.rs') }}

      - name: Download the benchmark games
        if: steps.benchmark-roms.outputs.cache-hit != 'true'
        run: cargo xtask benchmark-roms

      # cargo test checks the test cartridges' states on every platform; this
      # also checks the games'.
      - name: Check that the kept save states still load
        run: cargo save-states

      - name: Upload screens of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-rom-failures
          path: target/test-roms/failures
          if-no-files-found: ignore

  # Checks that the browser build compiles, links and gets its JavaScript
  # glue and license files. It builds with the release profile, which takes
  # a fraction of the time of the optimized one; deploy.yml builds that one
  # for GitHub Pages once CI has passed on main.
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      # Named apart from the caches of the optimized build, whose
      # dependencies the quick build can't use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: web-quick
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the web version
        run: cargo xtask build-web --quick

      # Reuses the xtask build above.
      - name: Check the newest release in the AppStream file is this version
        run: cargo xtask release-notes > /dev/null

      # Here rather than in the dependencies job, which has no xtask build to
      # reuse. The Flatpak builds with an older Rust than CI (docs/CI.md).
      - name: Check no crate needs a newer Rust than rust-version
        run: cargo xtask rust-version

  # The one check branch protection requires, so the list of required checks
  # doesn't have to change when the jobs above do.
  passed:
    name: CI passed
    if: always()
    needs: [lint, dependencies, test, test-roms, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

