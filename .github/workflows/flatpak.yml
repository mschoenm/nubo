name: Flatpak

# Builds the Linux app as a Flatpak for x86_64 and ARM with `cargo xtask
# flatpak`, plays a game in it and checks it with Flathub's linter. Runs
# every night and for releases, which attach the .flatpak files it makes, and
# by hand when a change needs it sooner. Pull requests don't run it: it
# rarely fails, and the nightly run catches a failure before a release can.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04's Flatpak is new enough for --device=input, which
          # gives the app its controllers, and for --device-if, which gives
          # older Flatpaks every device instead.
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      LINTER: ghcr.io/flathub/flatpak-builder-lint@sha256:fa11d9cf5044a1e251643f4abe58a2d456965bdc76372dc82c57d4f540cacd37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder

      - name: Install Rust
        run: rustup toolchain install

      # Installs the freedesktop runtime from Flathub the first time, builds
      # the app in it and writes target/bundle/Nubo-<version>-linux-<arch>.flatpak.
      - name: Build the Flatpak
        run: cargo xtask flatpak

      # The Flatpak is what Linux users install: the app built with the SDK's
      # Rust, running on the runtime's libraries inside its sandbox, which
      # nothing else tests. So the installed Flatpak plays a game here with
      # its efficiency harness, which needs no window or sound and fails
      # unless the game ran and made frames.
      - name: Play a game in the Flatpak
        shell: bash
        run: |
          cargo xtask benchmark-roms
          dbus-run-session -- flatpak run --user io.github.mschoenm.nubo \
            measure-efficiency "$PWD/target/benchmark-roms/tobudx.gb" | tee "$RUNNER_TEMP/efficiency.json"
          jq -e '.playing.buffers_per_second > 0 and .playing.frames_per_second > 0' "$RUNNER_TEMP/efficiency.json"

      # Uploaded before the linter runs, so nothing it does can change the
      # file that releases and the nightly build publish.
      - name: Upload the Flatpak
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: target/bundle/*.flatpak
          if-no-files-found: error

      # Flathub's linter is pinned by digest (LINTER), so an image someone
      # pushes under its tag never runs here, and each run gets only what it
      # reads. It should still be the newest, so that a check Flathub adds
      # fails the nightly run until Nubo could be published on Flathub again:
      # this warns when Flathub has published a newer image, and the digest
      # is then raised by hand (docs/CI.md).
      - name: Check that Flathub's linter is the newest
        if: matrix.arch == 'x86_64'
        continue-on-error: true
        shell: bash
        run: |
          image=flathub/flatpak-builder-lint
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$image:pull" | jq -r .token)
          newest=$(curl -fsSI -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$image/manifests/latest" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
          if [ "ghcr.io/flathub/flatpak-builder-lint@$newest" != "$LINTER" ]; then
            echo "::warning::Flathub's linter has a newer image ($newest): raise LINTER in flatpak.yml"
          fi

      # Flathub shows the AppStream file as it is in the repository, so it
      # has to pass Flathub's checks as it is.
      - name: Check the AppStream file with Flathub's linter
        if: matrix.arch == 'x86_64'
        run: >-
          docker run --rm -v "$PWD/frontends/nubo/linux:/linux:ro" "$LINTER"
          appstream /linux/io.github.mschoenm.nubo.metainfo.xml

      # The build must pass Flathub's checks too, so a check Flathub adds
      # fails the nightly run. The two screenshot checks are left out
      # (flatpak-lint-exceptions.json): only Flathub's own build copies the
      # screenshots to its server and points the AppStream data there, and
      # doing that here would show players of these files no screenshots.
      # It reads a copy of the repository, since ostree may want to write to
      # it.
      - name: Check the build with Flathub's linter
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          cp -a target/flatpak/repo "$RUNNER_TEMP/repo"
          docker run --rm -v "$RUNNER_TEMP/repo:/repo" \
            -v "$PWD/.github/flatpak-lint-exceptions.json:/exceptions.json:ro" \
            "$LINTER" --exceptions --user-exceptions /exceptions.json repo /repo
