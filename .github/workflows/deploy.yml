name: Push to gh-pages branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Rust code
        run: cargo build --verbose

      - name: Run Rust tests
        run: cargo test --verbose

      - name: Run test ROMs
        # --verify-boot runs the boot ROM before every test and checks that the
        # shortcut local runs take (starting from a copy of an earlier boot)
        # would have left each test in exactly the same state.
        run: cargo test-roms --verify-boot

      - name: Run JSON CPU tests
        run: cargo cpu-tests

      - name: Build the web version
        run: cargo xtask build-web

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/web
