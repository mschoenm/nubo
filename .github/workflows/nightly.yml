name: Nightly

# The checks too slow for every pull request, and the nightly metrics. GitHub
# emails whoever last changed the schedule below when a scheduled run fails.
# It runs at 23:17 UTC (01:17 Amsterdam time in summer, 00:17 in winter),
# so that even the slowest job is done before the nightly review starts at
# 04:07 Amsterdam time (see docs/NIGHTLY_REVIEW.md), even when GitHub starts
# it an hour or two late. GitHub reads the cron in UTC: a `timezone` key
# under it is ignored.
# The dates it writes are Amsterdam dates too, so each night gets its own
# whatever the season or a late start.
#
# Releases wait for these checks, so the long ones are split over several
# machines: each part runs one share of the test ROMs (`--shard`). To
# rebalance, add or remove numbers in a matrix; the parts follow.
on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
  # The release workflow runs these checks too.
  workflow_call:

permissions:
  contents: read

# Scheduled runs go one at a time: each reads the wiki in the `metrics` job
# and pushes to it in the `wiki` job, and two at once would read the same
# wiki. Every waiting run stays queued (`queue: max`), where by default a new
# one would cancel the one already waiting and lose its night. Other runs
# don't write to the wiki, so each gets a group of its own.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'nightly-wiki' || format('nightly-{0}', github.run_id) }}
  queue: max

env:
  CARGO_TERM_COLOR: always
  # No debug info, as in ci.yml (see there).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # CI too, so whatever a new stable Rust or another new release breaks
  # shows up the night it comes out, and releases need only run this.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  advisories:
    name: Security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      - name: Check the RustSec advisories
        run: cargo deny --locked check advisories

  # CI (above) tests on Linux; this covers macOS and Windows.
  tests:
    name: macOS and Windows
    uses: ./.github/workflows/platforms.yml

  verify-boot:
    name: Test ROMs with real boots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      passed: ${{ steps.count.outputs.passed }}
      total: ${{ steps.count.outputs.total }}
      shootout_passed: ${{ steps.count.outputs.shootout_passed }}
      shootout_total: ${{ steps.count.outputs.shootout_total }}
      shootout_rank: ${{ steps.count.outputs.shootout_rank }}
      shootout_leader: ${{ steps.count.outputs.shootout_leader }}
      shootout_leader_passed: ${{ steps.count.outputs.shootout_leader_passed }}
      shootout_published: ${{ steps.count.outputs.shootout_published }}
      shootout_commit: ${{ steps.count.outputs.shootout_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false

      - uses: ./.github/actions/test-roms

      # Runs the boot ROM before every test and checks that the shortcut the
      # other runs take (starting from a copy of an earlier boot) would have
      # left each test in exactly the same state.
      # `shell: bash` adds pipefail, so a failing run isn't hidden by tee.
      - name: Run test ROMs
        shell: bash
        run: cargo test-roms --verify-boot | tee "$RUNNER_TEMP/test-roms.txt"

      # The runner counts every test in "  total   2412/2630", then Nubo's
      # score on the GB Emulator Shootout's published tests in "  shootout
      # 258/264  rank 1  leader DocBoy 255  published 2026-06-04 72fd745" (the
      # leader's name can have spaces, such as "Beaten Dying Moon").
      - name: Count the passing tests
        id: count
        if: always()
        shell: bash
        run: |
          counts=$(awk '$1 == "total" { print $2 }' "$RUNNER_TEMP/test-roms.txt" | tail -n 1)
          echo "passed=${counts%/*}" >> "$GITHUB_OUTPUT"
          echo "total=${counts#*/}" >> "$GITHUB_OUTPUT"
          shootout=$(grep -E '^  shootout +[0-9]+/[0-9]+ +rank ' "$RUNNER_TEMP/test-roms.txt" | tail -n 1 || true)
          pattern='^  shootout +([0-9]+)/([0-9]+) +rank ([0-9]+) +leader (.+) ([0-9]+) +published ([0-9-]+) ([0-9a-f]+)$'
          if [[ $shootout =~ $pattern ]]; then
            {
              echo "shootout_passed=${BASH_REMATCH[1]}"
              echo "shootout_total=${BASH_REMATCH[2]}"
              echo "shootout_rank=${BASH_REMATCH[3]}"
              echo "shootout_leader=${BASH_REMATCH[4]}"
              echo "shootout_leader_passed=${BASH_REMATCH[5]}"
              echo "shootout_published=${BASH_REMATCH[6]}"
              echo "shootout_commit=${BASH_REMATCH[7]}"
            } >> "$GITHUB_OUTPUT"
          fi

      # Named apart from CI's, which runs in the same run.
      - name: Upload screens of failing tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-rom-failures-real-boots
          path: target/test-roms/failures
          if-no-files-found: ignore

  # Builds the benchmark once for the parts below, with the lazy shortcuts
  # and with the eager feature, which runs every M-cycle on its own.
  benchmark:
    name: Build the benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false

      # The parts restore the test ROMs from the cache this job saves when it
      # had to download them.
      - id: test-roms
        uses: ./.github/actions/test-roms

      - name: Download the test ROMs
        if: steps.test-roms.outputs.cache-hit != 'true'
        run: cargo test-roms acid2

      - name: Build the benchmark
        run: |
          mkdir "$RUNNER_TEMP/benchmark"
          cargo build --release --locked -p nubo-benchmark
          cp target/release/nubo-benchmark "$RUNNER_TEMP/benchmark/lazy"
          cargo build --release --locked -p nubo-benchmark --features nubo-core/eager
          cp target/release/nubo-benchmark "$RUNNER_TEMP/benchmark/eager"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nubo-benchmark
          path: ${{ runner.temp }}/benchmark
          retention-days: 1
          if-no-files-found: error

  save-states:
    name: Save states of all test ROMs (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: benchmark
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/test-roms

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nubo-benchmark
          path: ${{ runner.temp }}/benchmark

      # Halfway through each run a save state is loaded into a new emulator,
      # which must go on to make exactly the same frames, sound and state.
      - name: Check save states
        run: |
          chmod +x "$RUNNER_TEMP/benchmark/lazy"
          "$RUNNER_TEMP/benchmark/lazy" target/test-roms/v* target/test-roms/gb-emulator-shootout-* \
            --seconds 6 --jobs "$(nproc)" --check-save-states \
            --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  eager:
    name: Lazy components against every M-cycle (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: benchmark
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/test-roms

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nubo-benchmark
          path: ${{ runner.temp }}/benchmark

      - name: Record fingerprints with the lazy shortcuts
        run: |
          chmod +x "$RUNNER_TEMP/benchmark/lazy" "$RUNNER_TEMP/benchmark/eager"
          "$RUNNER_TEMP/benchmark/lazy" target/test-roms/v* target/test-roms/gb-emulator-shootout-* \
            --seconds 4 --jobs "$(nproc)" --record "$RUNNER_TEMP/lazy.txt" \
            --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # The eager feature runs every M-cycle on its own, with nothing left
      # behind; the lazy PPU and APU must give bit for bit the same output.
      - name: Compare with running every M-cycle on its own
        run: >-
          "$RUNNER_TEMP/benchmark/eager" target/test-roms/v* target/test-roms/gb-emulator-shootout-*
          --seconds 4 --jobs "$(nproc)" --compare "$RUNNER_TEMP/lazy.txt"
          --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The randomized PPU scenes compare the bulk runs with running dot by dot.
  # CI tries 18; this tries thousands, with a new seed each night (the run's
  # id), which a failure reports so it can be run again with that seed.
  random-scenes:
    name: Random PPU scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false

      - name: Compare 10,000 random scenes with running dot by dot
        env:
          NUBO_RANDOM_SCENES: 10000
          NUBO_RANDOM_SEED: ${{ github.run_id }}
        run: cargo test --release --locked -p nubo-core bulk_runs_match_running_dot_by_dot

  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml

  # Named as tonight's nightly build, except when a release runs these checks.
  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml
    with:
      nightly: ${{ github.workflow == 'Nightly' }}

  libretro:
    name: RetroArch core
    uses: ./.github/workflows/libretro.yml

  # The GB Emulator Shootout's own harness on the zip the Windows job built,
  # the one a release publishes.
  shootout:
    name: GB Emulator Shootout
    needs: windows
    uses: ./.github/workflows/shootout.yml
    with:
      windows-artifact: windows-x64

  # Measures speed, instructions, battery use and the build sizes, and writes
  # them with every job's result to the metrics log in the repository's wiki
  # (`cargo xtask metrics`). It also picks the part of the code the nightly
  # review reads in detail (`cargo xtask review-units`), so CI is the only
  # writer of the wiki. It starts once every other job has finished, so
  # nothing else of this run is busy while it measures and every night is
  # measured alike. Only scheduled runs write to the wiki: the review reads
  # the part of the latest night, and the rotation counts the changes since
  # the last night, so a run started by hand would hide the day's changes
  # from the review. This job only writes the files; the `wiki` job pushes
  # them, so the WIKI_TOKEN secret never reaches a machine that runs cargo.
  # Runs that don't push keep the files as their artifact. Releases run the
  # other jobs only.
  metrics:
    name: Metrics
    if: always() && github.workflow == 'Nightly'
    needs: [ci, advisories, tests, verify-boot, save-states, eager, random-scenes, flatpak, windows, libretro, shootout]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The rotation counts the files changed since the last night.
          fetch-depth: 0

      - name: Install audio and controller libraries and Valgrind
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config valgrind

      - name: Install Rust
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
          save-if: false

      - name: Download the benchmark games
        run: cargo xtask benchmark-roms

      - name: Build
        run: cargo build --release --locked -p nubo -p nubo-benchmark

      # One game at a time, so the games don't slow each other down.
      - name: Measure speed
        shell: bash
        run: target/release/nubo-benchmark target/benchmark-roms --seconds 30 | tee "$RUNNER_TEMP/speed.txt"

      # Instructions vary far less than time on shared machines, so they
      # show slow regressions that the speed's noise hides.
      - name: Count instructions per emulated second
        shell: bash
        run: |
          for rom in target/benchmark-roms/*; do
            for model in dmg cgb; do
              instructions=$(valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null \
                target/release/nubo-benchmark "$rom" --seconds 10 --models "$model" 2>&1 \
                | awk '/I *refs:/ { gsub(",", "", $NF); print $NF }')
              echo "$(basename "${rom%.*}")-$model $((instructions / 10))" >> "$RUNNER_TEMP/instructions.txt"
            done
          done
          cat "$RUNNER_TEMP/instructions.txt"

      - name: Measure battery use
        shell: bash
        run: target/release/nubo measure-efficiency target/benchmark-roms/tobudx.gb | tee "$RUNNER_TEMP/efficiency.json"

      - name: Build the web version
        run: cargo xtask build-web

      - name: Write tonight's metrics
        shell: bash
        env:
          CI: ${{ needs.ci.result }}
          ADVISORIES: ${{ needs.advisories.result }}
          TESTS: ${{ needs.tests.result }}
          VERIFY_BOOT: ${{ needs.verify-boot.result }}
          SAVE_STATES: ${{ needs.save-states.result }}
          EAGER: ${{ needs.eager.result }}
          RANDOM_SCENES: ${{ needs.random-scenes.result }}
          FLATPAK: ${{ needs.flatpak.result }}
          WINDOWS: ${{ needs.windows.result }}
          LIBRETRO: ${{ needs.libretro.result }}
          SHOOTOUT_HARNESS: ${{ needs.shootout.result }}
          PASSED: ${{ needs.verify-boot.outputs.passed }}
          TOTAL: ${{ needs.verify-boot.outputs.total }}
          SHOOTOUT_PASSED: ${{ needs.verify-boot.outputs.shootout_passed }}
          SHOOTOUT_TOTAL: ${{ needs.verify-boot.outputs.shootout_total }}
          SHOOTOUT_RANK: ${{ needs.verify-boot.outputs.shootout_rank }}
          SHOOTOUT_LEADER: ${{ needs.verify-boot.outputs.shootout_leader }}
          SHOOTOUT_LEADER_PASSED: ${{ needs.verify-boot.outputs.shootout_leader_passed }}
          SHOOTOUT_PUBLISHED: ${{ needs.verify-boot.outputs.shootout_published }}
          SHOOTOUT_COMMIT: ${{ needs.verify-boot.outputs.shootout_commit }}
        run: |
          # "tobudx [CGB-E]   108.2x ..." becomes {"tobudx-cgb": 108.2}.
          speed=$(awk '$2 ~ /^\[/ && $3 ~ /x$/ {
              model = tolower($2); gsub(/[\[\]]/, "", model); sub(/-.*/, "", model)
              speed = $3; sub(/x$/, "", speed)
              print $1 "-" model, speed
            }' "$RUNNER_TEMP/speed.txt" | jq -R -n '[inputs | split(" ") | {(.[0]): (.[1] | tonumber)}] | add')
          instructions=$(jq -R -n '[inputs | split(" ") | {(.[0]): (.[1] | tonumber)}] | add' "$RUNNER_TEMP/instructions.txt")
          jq -n \
            --arg date "$(TZ=Europe/Amsterdam date +%F)" \
            --arg commit "$(git rev-parse --short HEAD)" \
            --arg ci "$CI" --arg advisories "$ADVISORIES" --arg tests "$TESTS" --arg verify_boot "$VERIFY_BOOT" \
            --arg save_states "$SAVE_STATES" --arg eager "$EAGER" --arg random_scenes "$RANDOM_SCENES" \
            --arg flatpak "$FLATPAK" --arg windows "$WINDOWS" --arg libretro "$LIBRETRO" \
            --arg shootout_harness "$SHOOTOUT_HARNESS" \
            --arg passed "$PASSED" --arg total "$TOTAL" \
            --arg shootout_passed "$SHOOTOUT_PASSED" --arg shootout_total "$SHOOTOUT_TOTAL" \
            --arg shootout_rank "$SHOOTOUT_RANK" --arg shootout_leader "$SHOOTOUT_LEADER" \
            --arg shootout_leader_passed "$SHOOTOUT_LEADER_PASSED" \
            --arg shootout_published "$SHOOTOUT_PUBLISHED" --arg shootout_commit "$SHOOTOUT_COMMIT" \
            --argjson speed "$speed" \
            --argjson instructions "$instructions" \
            --slurpfile efficiency "$RUNNER_TEMP/efficiency.json" \
            --argjson desktop "$(stat -c %s target/release/nubo)" \
            --argjson wasm "$(stat -c %s target/web/nubo_bg.wasm)" \
            '{date: $date, commit: $commit,
              tests: {ci: $ci, advisories: $advisories, unit_tests: $tests, verify_boot: $verify_boot,
                      save_states: $save_states, eager: $eager, random_scenes: $random_scenes,
                      flatpak: $flatpak, windows: $windows, libretro: $libretro,
                      shootout_harness: $shootout_harness},
              test_roms_passed: ($passed | tonumber? // null),
              test_roms_total: ($total | tonumber? // null),
              shootout: (if $shootout_passed == "" then null else
                {passed: ($shootout_passed | tonumber), total: ($shootout_total | tonumber),
                 rank: ($shootout_rank | tonumber), leader: $shootout_leader,
                 leader_passed: ($shootout_leader_passed | tonumber),
                 published: $shootout_published, published_commit: $shootout_commit} end),
              speed: $speed,
              instructions_per_emulated_second: $instructions,
              efficiency: $efficiency[0],
              size_bytes: {desktop: $desktop, wasm: $wasm}}' > "$RUNNER_TEMP/night.json"
          cat "$RUNNER_TEMP/night.json"

      - name: Write tonight's wiki files
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          wiki="$RUNNER_TEMP/wiki"
          if git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" "$wiki"; then
            git -C "$wiki" rev-parse HEAD > "$RUNNER_TEMP/wiki-base"
          else
            echo "::warning::Couldn't clone the wiki (git's error is above), so tonight won't be recorded there."
            mkdir -p "$wiki"
          fi
          cargo xtask metrics append "$wiki/metrics.jsonl" "$RUNNER_TEMP/night.json"
          cargo xtask review-units next --state "$wiki/rotation.json" \
            --date "$(TZ=Europe/Amsterdam date +%F)" --commit "$(git rev-parse HEAD)" > "$wiki/tonight.json"
          cargo xtask metrics report "$wiki/metrics.jsonl" > "$wiki/Nightly-metrics.md"
          cat "$wiki/tonight.json"
          if [ "$SCHEDULED" != true ]; then
            echo "::notice::Only scheduled runs update the wiki; this run's files are kept as its artifact."
          fi

      - name: Keep tonight's metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-metrics
          path: |
            ${{ runner.temp }}/night.json
            ${{ runner.temp }}/wiki-base
            ${{ runner.temp }}/wiki/metrics.jsonl
            ${{ runner.temp }}/wiki/rotation.json
            ${{ runner.temp }}/wiki/tonight.json
            ${{ runner.temp }}/wiki/Nightly-metrics.md
          if-no-files-found: ignore

  # Pushes the metrics job's wiki files to the wiki, on scheduled runs only.
  # It is the only job that gets WIKI_TOKEN, and it runs on a machine of its
  # own: the metrics job runs code that cargo builds, and whatever that code
  # leaves behind there (a git hook, a changed PATH) could read the token if
  # the push ran on the same machine. It takes only the four files from the
  # metrics job's artifact, and pushes only if the wiki hasn't changed since
  # the metrics job read it. It runs whatever the other jobs' results, as
  # the metrics job does, since a night with a failed job is the one most
  # worth recording.
  wiki:
    name: Push the wiki
    if: always() && github.event_name == 'schedule' && needs.metrics.result == 'success'
    needs: metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-metrics
          path: ${{ runner.temp }}/metrics

      - name: Push the wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          files="$RUNNER_TEMP/metrics"
          wiki="$RUNNER_TEMP/wiki"
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::warning::The wiki wasn't updated: it needs the WIKI_TOKEN secret."
            exit 0
          fi
          if [ ! -f "$files/wiki-base" ]; then
            echo "::error::The Metrics job couldn't clone the wiki, so tonight wasn't recorded. Its log says why; a wiki without a first page needs one made by hand."
            exit 1
          fi
          git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" "$wiki"
          if [ "$(git -C "$wiki" rev-parse HEAD)" != "$(cat "$files/wiki-base")" ]; then
            echo "::error::The wiki changed after the metrics job read it, so tonight's files would undo that change."
            exit 1
          fi
          for file in metrics.jsonl rotation.json tonight.json Nightly-metrics.md; do
            cp "$files/wiki/$file" "$wiki/$file"
          done
          cd "$wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.jsonl rotation.json tonight.json Nightly-metrics.md
          git commit -m "Nightly metrics $(TZ=Europe/Amsterdam date +%F)"
          git push "https://x-access-token:$WIKI_TOKEN@github.com/${{ github.repository }}.wiki.git" HEAD
