name: Release

# Pushing a version tag such as v0.2.0 runs every check, the nightly ones
# included, builds the Flatpaks and makes a draft GitHub release with them to
# read over and publish. "Making a release" in CLAUDE.md lists the steps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # First, so a tag that doesn't match the version fails in a minute rather
  # than after every check.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Check the version and write the notes
        run: cargo xtask release-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  ci:
    name: CI
    needs: notes
    uses: ./.github/workflows/ci.yml

  # Includes the test ROMs with --verify-boot and the Flatpak builds.
  nightly:
    name: Nightly
    needs: notes
    uses: ./.github/workflows/nightly.yml

  release:
    name: Draft the release
    needs: [ci, nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Make a draft release with the Flatpaks
        run: >-
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --draft --verify-tag --title "Nubo ${GITHUB_REF_NAME#v}"
          --notes-file artifacts/release-notes/notes.md
          artifacts/flatpak-*/*.flatpak
        env:
          GH_TOKEN: ${{ github.token }}
