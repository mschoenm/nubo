name: Release

# Pushing a version tag such as v0.2.0 runs every check, the nightly ones
# included, builds the Flatpaks, the Windows installer and the RetroArch core
# and publishes a GitHub release with them. Nothing is published unless every check passes;
# the notes are read over in the release's pull request, before the tag.
# The release skill (.claude/skills/release/SKILL.md) lists the steps.
on:
  push:
    tags: ["v*"]
  # Or by hand with the version: that releases main as it is then and tags it
  # v<version> when it publishes. Claude's cloud sessions can't push tags, so
  # they release this way.
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 0.3.0
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The pushed tag, or the one a release started by hand makes.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  # First, so a tag that doesn't match the version fails in a minute rather
  # than after every check.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the checks rather than only when tagging, so a version that was
      # released already fails in a minute.
      - name: Check that a release started by hand is of main and its tag is new
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main, not $GITHUB_REF"
            exit 1
          fi
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || found=$?
          case $found in
            0) echo "::error::$TAG already exists"; exit 1 ;;
            2) ;;
            *) echo "::error::Couldn't check whether $TAG exists"; exit 1 ;;
          esac

      - name: Install Rust
        run: rustup toolchain install

      - name: Check the version and write the notes
        run: cargo xtask release-notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  # Includes CI, the test ROMs with --verify-boot, the Flatpaks, the
  # Windows installer, the GB Emulator Shootout's harness on the Windows zip
  # and the RetroArch core.
  nightly:
    name: Nightly
    needs: notes
    uses: ./.github/workflows/nightly.yml

  release:
    name: Publish the release
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # The files keep the same names in every release, so the README can link
      # to them in the latest one.
      - name: Name the files
        run: |
          mkdir upload
          for arch in x86_64 aarch64; do
            cp artifacts/flatpak-$arch/*.flatpak "upload/Nubo-linux-$arch.flatpak"
          done
          cp artifacts/windows-x64/*.msi upload/Nubo-windows-x64.msi
          cp artifacts/windows-x64/*.zip upload/Nubo-windows-x64.zip
          for platform in linux-x86_64 linux-aarch64 windows-x64 macos-universal; do
            cp artifacts/libretro-$platform/*.zip "upload/Nubo-libretro-$platform.zip"
          done

      # A release started by hand tags the commit every check ran on. GitHub
      # refuses a tag that exists, such as one pushed while the checks ran,
      # so the downloads can't end up under a tag on another commit; a re-run
      # finds the tag it made itself.
      - name: Tag a release started by hand
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG was made on $tagged while the checks ran, not on $GITHUB_SHA"
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # gh uploads the files to a draft and publishes it once they are all
      # there, so the release never shows without its downloads.
      - name: Publish the release with the downloads
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY"
          --verify-tag --title "Nubo ${TAG#v}"
          --notes-file artifacts/release-notes/notes.md
          upload/*
        env:
          GH_TOKEN: ${{ github.token }}
