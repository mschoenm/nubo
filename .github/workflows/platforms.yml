name: macOS and Windows

# Runs the workspace tests on macOS and Windows, which CI leaves out to stay
# fast (it tests on Linux). Pull requests don't run it: on Linux the same
# tests catch nearly everything, so the nightly workflow, which releases run,
# is where it runs, and by hand when a change needs it sooner. A workflow of
# its own rather than jobs in ci.yml, so a failure here doesn't fail the CI
# run that deploy.yml publishes the web version after.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      # The same key as CI's tests on Linux; the nightly runs on main keep
      # the macOS and Windows caches up to date.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --workspace --locked
