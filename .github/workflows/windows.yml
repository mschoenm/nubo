name: Windows

# Builds the Windows installer and zip with `cargo xtask windows` (Inno Setup
# comes with GitHub's Windows runners). Runs on pull requests that change
# how they are built, the crates or the Rust version they are built with
# (Dependabot's updates), every night, and for releases, which attach the
# files it makes. It isn't one of the checks that pull requests wait for.
on:
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - Cargo.lock
      - rust-toolchain.toml
      - xtask/src/windows.rs
      - xtask/src/licenses.rs
      - frontends/iced/windows/**
      - frontends/iced/build.rs
      - crates/nubo-logo/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the installer and the zip
        run: cargo xtask windows

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            target/bundle/*-windows-x64-setup.exe
            target/bundle/*-windows-x64.zip
          if-no-files-found: error
