name: Windows

# Builds the Windows installer and zip with `cargo xtask windows` (Inno Setup
# comes with GitHub's Windows runners) and plays a game from each. Runs on
# pull requests that change
# how they are built or the crates they are built from (Dependabot's
# updates), every night, and for releases, which attach the files it makes.
# It isn't one of the checks that pull requests wait for.
on:
  pull_request:
    paths:
      - .github/workflows/windows.yml
      - Cargo.lock
      - xtask/src/windows.rs
      - xtask/src/licenses.rs
      - frontends/iced/windows/**
      - frontends/iced/build.rs
      - crates/nubo-logo/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Windows installer (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the installer and the zip
        run: cargo xtask windows

      # The zip and the installer are what Windows users get: the release
      # build, which opens no console window, with its license files. Each is
      # unpacked or installed here as a player would, and plays a game with
      # the app's efficiency harness, which needs no window or sound and
      # fails unless the game ran and made frames. The installed Nubo is then
      # uninstalled, which must remove it again.
      - name: Play a game from the zip and from the installer
        shell: pwsh
        run: |
          cargo xtask benchmark-roms
          $rom = (Resolve-Path target/benchmark-roms/tobudx.gb).Path
          function Test-Nubo($folder) {
            foreach ($file in "LICENSE.txt", "LICENSE-APACHE.txt", "NOTICE.txt", "THIRD_PARTY_LICENSES.txt") {
              if (-not (Test-Path (Join-Path $folder $file))) { throw "$file is missing from $folder" }
            }
            # Capturing its output makes PowerShell wait for it, though it is
            # a windowed program.
            $json = & (Join-Path $folder "nubo.exe") --measure-efficiency $rom
            $json
            if ($LASTEXITCODE -ne 0) { throw "nubo.exe in $folder exited with $LASTEXITCODE" }
            $playing = ($json | ConvertFrom-Json).playing
            if ($playing.buffers_per_second -le 0 -or $playing.frames_per_second -le 0) {
              throw "nubo.exe in $folder didn't play the game"
            }
          }

          $unpacked = Join-Path $env:RUNNER_TEMP "zip"
          Expand-Archive -Path (Get-Item target/bundle/*-windows-x64.zip).FullName -DestinationPath $unpacked
          Test-Nubo (Join-Path $unpacked "Nubo")

          # Piping a program's output makes PowerShell wait for it.
          $silent = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          & (Get-Item target/bundle/*-windows-x64-setup.exe).FullName $silent | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "The installer exited with $LASTEXITCODE" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\Nubo"
          Test-Nubo $installed

          # The uninstaller hands over to a copy of itself and returns at once.
          & (Join-Path $installed "unins000.exe") $silent | Out-Null
          for ($second = 0; (Test-Path (Join-Path $installed "nubo.exe")) -and $second -lt 60; $second++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path (Join-Path $installed "nubo.exe")) { throw "The uninstaller left nubo.exe behind" }

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            target/bundle/*-windows-x64-setup.exe
            target/bundle/*-windows-x64.zip
          if-no-files-found: error
