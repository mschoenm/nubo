# Every dependency follows its newest stable release; the nightly CI run is
# where an update that breaks something shows up. Rust itself follows the
# stable channel (rust-toolchain.toml), so it needs no updates here.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      # Pinned to the same exact version in Cargo.toml; they must be upgraded
      # together.
      wasm-bindgen:
        patterns: ["wasm-bindgen", "wasm-bindgen-cli-support"]
      minor-and-patch:
        update-types: [minor, patch]
